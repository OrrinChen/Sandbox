validators:
  - name: schema
    purpose: validate typed task, tool, trace, validator, and run-result payloads
    failure_types:
      - schema_mismatch
      - unknown_schema
  - name: tool_sequence
    purpose: validate expected, allowed, and required tool-call ordering
    failure_types:
      - tool_sequence_mismatch
      - unexpected_tool
      - missing_required_tool
  - name: argument
    purpose: validate tool-call arguments against registered ToolSpec input schemas
    failure_types:
      - invalid_tool_call_payload
      - invalid_tool_arguments
  - name: state
    purpose: validate added, modified, and deleted file state diffs
    failure_types:
      - state_mismatch
  - name: numeric
    purpose: validate numeric outputs with deterministic tolerance
    failure_types:
      - invalid_numeric_value
      - invalid_numeric_tolerance
      - numeric_mismatch
  - name: citation
    purpose: validate final-answer citations against supported fixture sources
    failure_types:
      - unsupported_citation
      - missing_citation
  - name: constraint
    purpose: validate reported metrics against deterministic feasibility constraints
    failure_types:
      - invalid_constraint
      - constraint_violation
  - name: unit_test
    purpose: validate sandboxed Python unit test execution results
    failure_types:
      - unit_tests_missing
      - unit_tests_failed
  - name: policy
    purpose: validate deterministic required and forbidden final-answer terms
    failure_types:
      - policy_violation
  - name: cost_latency
    purpose: validate task-local cost, latency, turn, and timeout limits
    failure_types:
      - cost_latency_violation
  - name: lookahead_validator
    purpose: validate that trading backtests do not use future-return columns or lookahead-enabled configs
    failure_types:
      - backtest_missing
      - lookahead_detected
  - name: pnl_consistency_validator
    purpose: validate reported trading PnL and risk metrics against the executed backtest artifact
    failure_types:
      - backtest_missing
      - pnl_consistency_mismatch
  - name: cost_inclusion_validator
    purpose: validate that trading backtests include fees and cost-aware execution assumptions
    failure_types:
      - backtest_missing
      - costs_not_included
  - name: risk_limit_validator
    purpose: validate risk-check artifacts and max-drawdown limits before accepting a strategy
    failure_types:
      - risk_check_missing
      - risk_limit_violation
  - name: artifact_grounding_validator
    purpose: validate that trading conclusions cite required artifacts observed in the trace
    failure_types:
      - artifact_grounding_missing
