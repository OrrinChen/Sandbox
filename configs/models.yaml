models:
  - id: recorded_gpt_style_agent
    type: recorded
    model: recorded-gpt-style-v1
    prompt_version: recorded-model-study-v1
    fixture: fixtures/model_outputs/silent_failure_study.json
    default_enabled: true
    network_required: false
  - id: recorded_model_matrix
    type: recorded_matrix
    fixture: fixtures/model_outputs/model_matrix.json
    default_enabled: true
    network_required: false
    profiles:
      - recorded-good-fixture-v1
      - recorded-overconfident-fixture-v1
      - recorded-tool-sloppy-fixture-v1
      - recorded-citation-sloppy-fixture-v1
      - recorded-state-sloppy-fixture-v1
  - id: openai_responses
    type: live_optional
    endpoint: https://api.openai.com/v1/responses
    auth_env: OPENAI_API_KEY
    model_env: OPENAI_MODEL
    default_enabled: false
    network_required: true
    requires_live_flag: true
  - id: generic_http_live
    type: live_optional
    endpoint_env: GENERIC_HTTP_MODEL_ENDPOINT
    auth_env: GENERIC_HTTP_API_KEY
    model_env: GENERIC_HTTP_MODEL
    default_enabled: false
    network_required: true
    requires_live_flag: true
