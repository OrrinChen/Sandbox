[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxed-agent-eval-harness"
version = "0.1.0"
description = "Sandboxed evaluation harness for detecting silent failures in tool-using agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
ai-integrations = [
    "langchain>=1,<2; python_version >= '3.10'",
    "langgraph>=1,<2; python_version >= '3.10'",
    "langgraph-checkpoint-sqlite>=2,<3; python_version >= '3.10'",
    "langsmith>=0.4,<1; python_version >= '3.10'",
]

[project.scripts]
sandboxed-agent-eval = "sandboxed_agent_eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
