# Phase 3 default tool declarations mirror default_tool_specs().
tools:
  - tool_name: financial_statement.lookup
    domain: finance
    backing: fixture
    permissions:
      - read_fixture
    side_effects: []
    failure_modes:
      - missing_fixture
      - wrong_fiscal_period
      - wrong_statement_type
      - unsupported_ticker
  - tool_name: transcript.search
    domain: finance
    backing: fixture
    permissions:
      - read_fixture
    side_effects: []
    failure_modes:
      - missing_fixture
      - unsupported_query
      - unsupported_citation
      - wrong_fiscal_period
  - tool_name: csv.read
    domain: data_analysis
    backing: local_file
    permissions:
      - read_visible_files
    side_effects: []
    failure_modes:
      - missing_file
      - invalid_csv
      - schema_mismatch
  - tool_name: csv.group_metrics
    domain: data_analysis
    backing: local_file
    permissions:
      - read_visible_files
      - write_task_workspace
    side_effects:
      - writes_file
    state_mutation:
      writes:
        - summary_table
    failure_modes:
      - missing_file
      - missing_column
      - invalid_metric
      - invalid_csv
      - write_denied
