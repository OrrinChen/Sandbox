name: sandboxed-agent-eval-harness-ci

on:
  push:
    paths:
      - "**"
      - ".github/workflows/sandboxed-agent-eval-harness-ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/sandboxed-agent-eval-harness-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install offline benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor-profiles bubblewrap libreoffice-calc
          if ! bwrap --unshare-all --ro-bind / / -- /usr/bin/true; then
            sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            bwrap --unshare-all --ro-bind / / -- /usr/bin/true
          fi

      - name: Install package
        run: |
          python -m pip install --upgrade pip 'setuptools>=68' wheel
          python -m pip install -e ".[dev]"

      - name: Run reproducibility checks
        run: make ci

      - name: Verify the installed wheel offline
        run: python scripts/smoke_rag_wheel.py

      - name: Verify the installed financial benchmark
        run: python scripts/smoke_rag_wheel.py --financial

      - name: Run the installed evidence engine outside the checkout
        run: |
          wheelhouse="$RUNNER_TEMP/evidence-wheels"
          engine_env="$RUNNER_TEMP/evidence-venv"
          python -m pip wheel --no-build-isolation --wheel-dir "$wheelhouse" .
          python -m venv "$engine_env"
          "$engine_env/bin/python" -m pip install --no-index --find-links "$wheelhouse" sandboxed-agent-eval-harness
          cd "$RUNNER_TEMP"
          "$engine_env/bin/financial-evidence" verify-claim --claim 'Apple FY2024 revenue was $391.035 billion.'
          "$engine_env/bin/financial-evidence" build-corpus --corpus raw
          "$engine_env/bin/financial-evidence" serve-demo --dry-run
          "$engine_env/bin/financial-evidence" hard-benchmark --output-dir "$RUNNER_TEMP/claim-study"
          "$engine_env/bin/sandboxed-agent-eval" --version

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandboxed-agent-eval-harness-artifacts
          path: artifacts/
